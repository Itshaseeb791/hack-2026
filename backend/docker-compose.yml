services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savefood
      POSTGRES_PASSWORD: savefood
      POSTGRES_DB: savefood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savefood"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build: .
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://savefood:savefood@db:5432/savefood
      TZ: Asia/Karachi
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
