services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: savefood
      POSTGRES_PASSWORD: savefood
      POSTGRES_DB: savefood
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savefood"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://savefood:savefood@db:5432/savefood
      TZ: Asia/Karachi
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: https://apifood.thebullgym.com
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
